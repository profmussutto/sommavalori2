<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Somma valori legati - Sol 2° rigo</title>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
<style>
  body{font-family:system-ui;margin:0;padding:12px;background:#fafafa}
  #app{max-width:900px;margin:auto;box-sizing:border-box}
  .box{max-width:850px;margin:auto;background:#fff;padding:16px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
  input,select{padding:7px;border-radius:8px;border:1px solid #ccc}
  button{background:#ff6b35;color:#fff;border:0;padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer}
  #staffBox{border:2px dashed #e9c46a;border-radius:12px;padding:8px;min-height:140px;text-align:center;background:#fff}
  /* Stesso fullscreen delle altre app */
  #app:fullscreen{max-width:100%;width:100%;height:100%;border:none;border-radius:0;overflow:auto;background:#fafafa;padding:12px}
  #app.pseudo-fs{position:fixed;inset:0;z-index:9999;max-width:100%;width:100%;height:100%;border:none;border-radius:0;overflow:auto;background:#fafafa;padding:12px}
</style>
</head>
<body>
<div id="app">
<div class="box">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <h3 style="margin:0">🎵 Somma valori legati - Sol 2° rigo</h3>
  <button id="fsBtn" onclick="toggleFS()" style="background:#fff;color:#111;border:2px solid #222;padding:8px 12px">⛶ Schermo intero</button>
</div>
<br>
Nome e Cognome <input id="nc" style="width:220px" placeholder="Es. Mario Rossi"> N° note <select id="q"><option>3</option><option>4</option><option selected>5</option></select> <b id="tm">00:00</b><br><br>
<div id="staffBox"><div id="staff"></div><div id="place" style="color:#aaa;padding:30px">Premi AVVIA</div><div id="ris" style="display:none">Somma = <input id="rn" type="number" style="width:55px"> / <input id="rd" type="number" style="width:55px"></div><div id="corr"></div></div><br>
<button id="go">▶️ AVVIA</button> <button id="fin" style="display:none">✅ FINITO</button>
</div>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwJ6HjzfirkviR_YB4oq3e67YlALbu9ZguDWQP7eeQYgDQcO0n38uCtPG-zeuuZl79f/exec";
const VAL=[{l:'4/4',v:16,x:'w',d:0},{l:'3/4',v:12,x:'h',d:1},{l:'2/4',v:8,x:'h',d:0},{l:'3/8',v:6,x:'q',d:1},{l:'1/4',v:4,x:'q',d:0},{l:'3/16',v:3,x:'8',d:1},{l:'1/8',v:2,x:'8',d:0},{l:'1/16',v:1,x:'16',d:0}];
let cur=[],st,ti,corN,corD;
function gcd(a,b){return b?gcd(b,a%b):a}
function render(){
 const div=document.getElementById('staff');div.innerHTML='';let w=Math.max(500,cur.length*110+80);
 let ren=new Vex.Flow.Renderer(div,Vex.Flow.Renderer.Backends.SVG);ren.resize(w,160);
 let ctx=ren.getContext();let stave=new Vex.Flow.Stave(10,10,w-20);stave.addClef('treble').setContext(ctx).draw();
 let notes=cur.map(c=>{let dur=c.x+(c.d?'d':'');let n=new Vex.Flow.StaveNote({clef:'treble',keys:['g/4'],duration:dur});if(c.d)Vex.Flow.Dot.buildAndAttach([n],{all:true});return n});
 let beams=[],g=[];notes.forEach((n,i)=>{if(['8','16'].includes(cur[i].x))g.push(n);else{if(g.length>1)beams.push(new Vex.Flow.Beam(g));g=[]}});if(g.length>1)beams.push(new Vex.Flow.Beam(g));
 let voice=new Vex.Flow.Voice({num_beats:cur.length*4,beat_value:4});voice.setStrict(false);voice.addTickables(notes);
 new Vex.Flow.Formatter().joinVoices([voice]).formatToStave([voice],stave);voice.draw(ctx,stave);beams.forEach(b=>b.setContext(ctx).draw());
 for(let i=0;i<notes.length-1;i++){new Vex.Flow.StaveTie({first_note:notes[i],last_note:notes[i+1],first_indices:[0],last_indices:[0]}).setContext(ctx).draw();}
}
go.onclick=()=>{
 if(!nc.value.trim()){alert('Inserisci Nome e Cognome');return}
 cur=[];for(let i=0;i<parseInt(q.value);i++)cur.push(VAL[Math.floor(Math.random()*VAL.length)]);
 let tot=cur.reduce((s,c)=>s+c.v,0);let g=gcd(tot,16);corN=tot/g;corD=16/g;
 place.style.display='none';render();ris.style.display='block';corr.innerHTML='';fin.style.display='inline';go.style.display='none';
 st=Date.now();clearInterval(ti);ti=setInterval(()=>{let d=Math.floor((Date.now()-st)/1000);tm.textContent=String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')},200);
};
fin.onclick=()=>{
 let nn=parseInt(rn.value),dd=parseInt(rd.value);if(!nn||!dd){alert('Frazione');return}
 let tempo=Math.floor((Date.now()-st)/1000);clearInterval(ti);
 let g=gcd(nn,dd);let sn=nn/g,sd=dd/g;let ok=(sn==corN&&sd==corD);
 corr.innerHTML=`<div style="background:${ok?'#f0fdf4':'#fef2f2'};padding:10px;border-radius:8px;margin-top:8px"><b>${ok?'✅ OK':'❌ NO'}</b> Corretta ${corN}/${corD} - Tua ${sn}/${sd} - ${tempo}s<br><small>${cur.map(c=>c.l).join(' + ')}</small></div>`;
 // NUOVO: fetch verso Apps Script invece di google.script.run
 fetch(API_URL, {
   method: 'POST',
   headers: {'Content-Type': 'text/plain;charset=utf-8'},
   body: JSON.stringify({nomecognome:nc.value.trim(), n_note:cur.length, valori:cur.map(c=>c.l).join('+'), somma_corretta:corN+'/'+corD, risposta:nn+'/'+dd, esito:ok?'OK':'NO', tempo:tempo})
 }).catch(()=>{});
 fin.style.display='none';go.style.display='inline';go.textContent='🔄 Nuovo esercizio';
};

// STESSA FUNZIONE DELLE ALTRE DUE APP
function toggleFS(){
  const app = document.getElementById('app');
  const btn = document.getElementById('fsBtn');
  if(document.fullscreenElement || app.classList.contains('pseudo-fs')){
    if(document.fullscreenElement) document.exitFullscreen();
    app.classList.remove('pseudo-fs');
    btn.textContent = '⛶ Schermo intero';
    return;
  }
  if(app.requestFullscreen){
    app.requestFullscreen().then(()=>{ btn.textContent = '✕ Esci'; }).catch(()=>{ app.classList.add('pseudo-fs'); btn.textContent = '✕ Esci'; });
  } else { app.classList.add('pseudo-fs'); btn.textContent = '✕ Esci'; }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement){
    const app = document.getElementById('app');
    app.classList.remove('pseudo-fs');
    document.getElementById('fsBtn').textContent = '⛶ Schermo intero';
  }
});
</script>
</body>
</html>
